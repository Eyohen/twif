<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The old favicon was a blue mark left over from another project. These
         are the TWIF lockup: an SVG for browsers that take one, a PNG for the
         rest, and a 180px icon for an iOS home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches the app bar, so the system status bar blends into the app
         instead of sitting as a black band above a light header. -->
    <meta name="theme-color" content="#fffdfa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Twif OMS" />
    <!-- The bar is light, so iOS needs dark status-bar text to stay legible. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Twif Operations Management System for invoices, payments, production, inventory, tailoring, and customer tracking." />
    <title>Twif OMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
